# Resiliency/fuzz config: same specs, same live app, but deliberately
# mutated/generated inputs (schemaResiliencyTests: all) instead of the
# contract-correctness question the contract-test-all run already answers.
# Kept as a fully separate run/report from that one -- blending "the API
# doesn't match the docs" failures with "the API didn't reject garbage
# gracefully" failures produces an unreadable wall of failures, regardless
# of whether real credentials are involved.
#
# Real examples ARE loaded here (unlike this file's first version), via the
# v3 rich-form config's components.services.<name>.data.examples.directories
# key -- NOT the --examples CLI flag, which is mutually exclusive with
# --config and silently drops external examples if both are passed. This
# combination (real auth/fixtures + full schema-resiliency fuzzing, in one
# report) was verified live against all 12 specs: see README "Combining
# real examples with schemaResiliencyTests: all across all 12 specs".
#
# `components:` is a top-level sibling of `specmatic:`, not nested under
# it -- the nested form errors with "specmatic.components is not a valid
# property" on this pinned image.
version: 3
components:
  sources:
    localFilesystemRepo:
      filesystem:
        directory: "/usr/src/app"

  services:
    rocketchatApi:
      description: "Rocket.Chat REST API, all 12 spec files"
      definitions:
        - definition:
            source:
              $ref: "#/components/sources/localFilesystemRepo"
            specs:
              - "specs/authentication.yaml"
              - "specs/content-management.yaml"
              - "specs/integrations.yaml"
              - "specs/marketplace-apps.yaml"
              - "specs/messaging.yaml"
              - "specs/miscellaneous.yaml"
              - "specs/notifications.yaml"
              - "specs/omnichannel.yaml"
              - "specs/rooms.yaml"
              - "specs/settings.yaml"
              - "specs/statistics.yaml"
              - "specs/user-management.yaml"
      data:
        examples:
          - directories:
              - "/usr/src/app/examples"

specmatic:
  settings:
    test:
      schemaResiliencyTests: all
