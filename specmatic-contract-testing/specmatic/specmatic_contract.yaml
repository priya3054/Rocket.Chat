# Contract-correctness config: does the live app's behavior match what the
# spec documents, with generative/fuzz resiliency testing switched off (see
# specmatic_resiliency.yaml, added later, for that separate run). Schema
# keys verified empirically against the pinned specmatic/specmatic:2.50.0
# image: governance.successCriteria is a sibling of governance.report, and
# the v3 coverage keys are minCoveragePercentage/maxMissedOperationsInSpec/
# enforce.
#
# No governance gate yet -- this runs one spec file (authentication.yaml)
# at a time while real coverage is still being measured. The honest gate
# gets added once the full per-spec-file pass is done (see FINDINGS in
# README.md), not before, so it reflects a real baseline rather than a
# placeholder.
version: 3
specmatic:
  settings:
    test:
      schemaResiliencyTests: none
  governance:
    report:
      outputDirectory: /usr/src/app/reports
      formats: [html]
