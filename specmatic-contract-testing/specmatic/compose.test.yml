# Overlay for ../rocketchat-docker/compose.yml. Run merged with the base
# file so the `rocketchat` service name resolves as a hostname on the same
# Docker network:
#
#   docker compose -f ../rocketchat-docker/compose.yml -f compose.test.yml --profile mock up specmatic-mock
#
# Note: DEPRECATED_COMPOSE_ACK must be set in the environment before the
# base compose file will parse at all (it's a hard require() on that var).
#
# Note: when merging multiple -f files, Compose resolves every relative
# bind-mount source against the directory of the FIRST file on the command
# line, not the file the mount is declared in -- so the run command above
# passes rocketchat-docker/compose.yml first and the path below is written
# as ../contracts (relative to rocketchat-docker/), not ./contracts.
#
# All 12 specs come from one place: ../contracts, a submodule pinned to
# priya3054/Rocket.Chat-Open-API's main branch, which is an untouched
# mirror of upstream RocketChat/Rocket.Chat-Open-API main. No fork with
# hand-applied fixes is in the loop here or anywhere else in this setup --
# the spec is read-only input, never edited.
services:
  specmatic-mock:
    image: specmatic/specmatic:2.50.0
    profiles: ["mock"]
    volumes:
      - ../contracts:/usr/src/app/specs:ro
    ports:
      - "9000:9000"
    command:
      - mock
      - /usr/src/app/specs/authentication.yaml
      - /usr/src/app/specs/content-management.yaml
      - /usr/src/app/specs/integrations.yaml
      - /usr/src/app/specs/marketplace-apps.yaml
      - /usr/src/app/specs/messaging.yaml
      - /usr/src/app/specs/miscellaneous.yaml
      - /usr/src/app/specs/notifications.yaml
      - /usr/src/app/specs/omnichannel.yaml
      - /usr/src/app/specs/rooms.yaml
      - /usr/src/app/specs/settings.yaml
      - /usr/src/app/specs/statistics.yaml
      - /usr/src/app/specs/user-management.yaml
      - --host
      - 0.0.0.0
      - --port
      - "9000"

  # Provider contract test, one spec file at a time (see README "Issues
  # found and fixed" for why: blending all specs together produced an
  # unreadable wall of failures on the first attempt at this project).
  # Swap the spec path + --filter below to whichever file is currently
  # being triaged; each file's findings are recorded in README.md as they
  # land, and all 12 get wired together for real CI in a later step.
  # No --config here: verified empirically against this pinned image that
  # supplying --config alongside --examples silently disables external
  # example loading entirely (0 real-credential requests sent vs. real
  # requests with --config omitted, same specs/examples otherwise) --
  # config-declared "examples" isn't even a valid key in this version
  # (its own validation error lists governance/license/settings as the
  # only top-level specmatic: properties). Since schemaResiliencyTests is
  # off by default with no config anyway, dropping --config costs nothing
  # for this contract-only run; --config comes back once coverage
  # governance is wired (see README), at which point real examples need
  # re-verifying against that combination too.
  specmatic-contract-test:
    image: specmatic/specmatic:2.50.0
    profiles: ["test"]
    volumes:
      - ../contracts:/usr/src/app/specs:ro
      - ../specmatic/examples:/usr/src/app/examples:ro
      - ../specmatic/reports/contract:/usr/src/app/reports
    depends_on:
      - rocketchat
    command:
      - test
      - /usr/src/app/specs/authentication.yaml
      - --examples
      - /usr/src/app/examples
      - --testBaseURL=http://rocketchat:${PORT:-3000}
      - --junitReportDir=/usr/src/app/reports
      # Exclusions, each a documented spec-blocker/test-isolation case, not
      # a spec edit -- see README "Issues found and fixed" for the evidence
      # behind each one:
      # - the 3 "login - with X" paths aren't real routes (ApiClass.ts
      #   registers a single 'login' route for every login variant), so
      #   they 404 by construction, not by app defect.
      # - logout invalidates the one shared admin token every other
      #   scenario in this run depends on.
      # - twoFactorChallenges.sendEmailCode/verifyChallenge have no
      #   corresponding route anywhere in the server code at all.
      - --filter=!(PATH='/api/v1/login - with Facebook') && !(PATH='/api/v1/login - with Twitter') && !(PATH='/api/v1/login - with Google') && !(PATH='/api/v1/logout') && !(PATH='/api/v1/twoFactorChallenges.sendEmailCode') && !(PATH='/api/v1/twoFactorChallenges.verifyChallenge')

  # content-management.yaml: 5 read (list/all/getOne) + 3 write
  # (custom-user-status create/update/delete) operations verified clean
  # with real auth. The other 8 write operations (emoji-custom.*,
  # custom-sounds.create/update/delete, assets.*) all require
  # multipart/form-data file uploads and are deferred -- not filtered out,
  # left failing and documented in README, same treatment as
  # authentication.yaml's not-yet-wired 2FA operations.
  specmatic-contract-test-content-management:
    image: specmatic/specmatic:2.50.0
    profiles: ["test"]
    volumes:
      - ../contracts:/usr/src/app/specs:ro
      - ../specmatic/examples:/usr/src/app/examples:ro
      - ../specmatic/reports/content-management:/usr/src/app/reports
    depends_on:
      - rocketchat
    command:
      - test
      - /usr/src/app/specs/content-management.yaml
      - --examples
      - /usr/src/app/examples
      - --testBaseURL=http://rocketchat:${PORT:-3000}
      - --junitReportDir=/usr/src/app/reports

  # notifications.yaml: 6 of 8 operations verified with real requests (5
  # clean, 1 genuine drift -- push.token's real response field is
  # `_updatedAt`, spec says `updatedAt`). push.get deferred: needs a real
  # message _id, a cross-spec fixture dependency on messaging.yaml.
  specmatic-contract-test-notifications:
    image: specmatic/specmatic:2.50.0
    profiles: ["test"]
    volumes:
      - ../contracts:/usr/src/app/specs:ro
      - ../specmatic/examples:/usr/src/app/examples:ro
      - ../specmatic/reports/notifications:/usr/src/app/reports
    depends_on:
      - rocketchat
    command:
      - test
      - /usr/src/app/specs/notifications.yaml
      - --examples
      - /usr/src/app/examples
      - --testBaseURL=http://rocketchat:${PORT:-3000}
      - --junitReportDir=/usr/src/app/reports

  # messaging.yaml: 44 operations, real fixtures seeded (message, threaded
  # reply, DM room) by regenerate-auth-examples.sh. --lenient is required
  # here specifically: the SPEC's own inline examples (not ours) have
  # genuine defects -- dm.list's own example has an md[] value typed
  # inconsistently, dm.setTopic's own example omits required auth headers
  # -- which abort the entire file's example loading to a single
  # synthetic failure without --lenient (verified: Tests run: 1 without
  # the flag, 126 with it). This directly contradicts the old branch's
  # blanket claim that --lenient "drops the whole suite to 1 test" --
  # empirically, for this spec file, the opposite is true. Every one of
  # the ~105 remaining failures collapses into one of a handful of
  # documented, systemic accepted-drift categories (see README) rather
  # than being 105 distinct issues.
  specmatic-contract-test-messaging:
    image: specmatic/specmatic:2.50.0
    profiles: ["test"]
    volumes:
      - ../contracts:/usr/src/app/specs:ro
      - ../specmatic/examples:/usr/src/app/examples:ro
      - ../specmatic/reports/messaging:/usr/src/app/reports
    depends_on:
      - rocketchat
    command:
      - test
      - /usr/src/app/specs/messaging.yaml
      - --examples
      - /usr/src/app/examples
      - --testBaseURL=http://rocketchat:${PORT:-3000}
      - --junitReportDir=/usr/src/app/reports
      - --lenient

  # All 12 specs together, real examples -- this is what Step 4's honest
  # 4% coverage baseline was measured from (see README). --lenient
  # required (messaging.yaml's own inline examples have genuine defects,
  # see that section) and --timeout-in-ms 15000 required (the default
  # 6000ms produced a cascade of client-side timeouts under this run's
  # full 1238-test load -- confirmed NOT a server hang, see README Step 4
  # for the full correction). This is the service the CI coverage gate
  # (Step 6) actually runs.
  specmatic-contract-test-all:
    image: specmatic/specmatic:2.50.0
    profiles: ["test"]
    volumes:
      - ../contracts:/usr/src/app/specs:ro
      - ../specmatic/examples:/usr/src/app/examples:ro
      - ../specmatic/reports/all:/usr/src/app/reports
    depends_on:
      - rocketchat
    command:
      - test
      - /usr/src/app/specs/authentication.yaml
      - /usr/src/app/specs/content-management.yaml
      - /usr/src/app/specs/integrations.yaml
      - /usr/src/app/specs/marketplace-apps.yaml
      - /usr/src/app/specs/messaging.yaml
      - /usr/src/app/specs/miscellaneous.yaml
      - /usr/src/app/specs/notifications.yaml
      - /usr/src/app/specs/omnichannel.yaml
      - /usr/src/app/specs/rooms.yaml
      - /usr/src/app/specs/settings.yaml
      - /usr/src/app/specs/statistics.yaml
      - /usr/src/app/specs/user-management.yaml
      - --examples
      - /usr/src/app/examples
      - --testBaseURL=http://rocketchat:${PORT:-3000}
      - --junitReportDir=/usr/src/app/reports
      - --lenient
      - --timeout-in-ms=15000
      - --filter=!(PATH='/api/v1/login - with Facebook') && !(PATH='/api/v1/login - with Twitter') && !(PATH='/api/v1/login - with Google') && !(PATH='/api/v1/logout') && !(PATH='/api/v1/twoFactorChallenges.sendEmailCode') && !(PATH='/api/v1/twoFactorChallenges.verifyChallenge')

  # Resiliency/fuzz run, all 12 specs, informational only -- see
  # specmatic_resiliency.yaml for why there's no --examples here
  # (mutually exclusive with --config in this pinned image, and
  # schemaResiliencyTests has no CLI flag).
  specmatic-resiliency-test-all:
    image: specmatic/specmatic:2.50.0
    profiles: ["test"]
    volumes:
      - ../contracts:/usr/src/app/specs:ro
      - ../specmatic/specmatic_resiliency.yaml:/usr/src/app/specmatic.yaml:ro
      - ../specmatic/reports/resiliency:/usr/src/app/reports
    depends_on:
      - rocketchat
    command:
      - test
      - /usr/src/app/specs/authentication.yaml
      - /usr/src/app/specs/content-management.yaml
      - /usr/src/app/specs/integrations.yaml
      - /usr/src/app/specs/marketplace-apps.yaml
      - /usr/src/app/specs/messaging.yaml
      - /usr/src/app/specs/miscellaneous.yaml
      - /usr/src/app/specs/notifications.yaml
      - /usr/src/app/specs/omnichannel.yaml
      - /usr/src/app/specs/rooms.yaml
      - /usr/src/app/specs/settings.yaml
      - /usr/src/app/specs/statistics.yaml
      - /usr/src/app/specs/user-management.yaml
      - --config=/usr/src/app/specmatic.yaml
      - --testBaseURL=http://rocketchat:${PORT:-3000}
      - --junitReportDir=/usr/src/app/reports
      - --lenient
      - --timeout-in-ms=15000
