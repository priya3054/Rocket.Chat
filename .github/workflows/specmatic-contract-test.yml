name: Specmatic Contract Test

# Brings up real RocketChat + MongoDB and checks live responses against
# all 12 OpenAPI specs, using real auth/fixture data via external Specmatic
# examples (regenerate-auth-examples.sh), not spec edits or fixed
# credentials (see specmatic-contract-testing/README.md for why the spec
# itself is never touched).
#
# The goal here isn't chasing a coverage percentage -- most of these
# operations' failures are already-documented, accepted spec/app drift
# (see README), not bugs worth blocking merges over. Coverage is reported
# as an informational number. The actual gate below fails only on a real
# regression signal: Specmatic reporting framework-level Errors (a crash,
# not a scenario mismatch), or the real-example-backed run producing zero
# Successes (meaning auth/fixture generation broke and every test is
# running against garbage credentials instead of real ones).

on:
  pull_request:
    branches: [develop]
    paths:
      - "specmatic-contract-testing/**"
      - ".github/workflows/specmatic-contract-test.yml"
  push:
    branches: [develop, specmatic]
    paths:
      - "specmatic-contract-testing/**"
      - ".github/workflows/specmatic-contract-test.yml"

jobs:
  contract-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: specmatic-contract-testing
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Bring up RocketChat + MongoDB
        run: |
          DEPRECATED_COMPOSE_ACK=1 docker compose -f rocketchat-docker/compose.yml -f specmatic/compose.test.yml up -d rocketchat mongodb

      - name: Wait for RocketChat to be ready
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/info || echo 000)
            if [ "$code" = "200" ]; then echo "RocketChat is up"; exit 0; fi
            echo "waiting for RocketChat... ($i)"
            sleep 3
          done
          echo "RocketChat did not become ready in time" >&2
          exit 1

      - name: Generate live auth/fixture examples
        run: ./specmatic/scripts/regenerate-auth-examples.sh

      - name: Dump RocketChat logs (diagnostics)
        if: failure()
        run: |
          DEPRECATED_COMPOSE_ACK=1 docker compose -f rocketchat-docker/compose.yml -f specmatic/compose.test.yml logs rocketchat mongodb > rocketchat-diagnostics.log 2>&1 || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contract-test-diagnostics
          path: specmatic-contract-testing/rocketchat-diagnostics.log

      - name: Run contract tests, all 12 specs (report-only -- see regression gate step below)
        continue-on-error: true
        run: |
          DEPRECATED_COMPOSE_ACK=1 docker compose \
            -f rocketchat-docker/compose.yml -f specmatic/compose.test.yml \
            --profile test up specmatic-contract-test-all \
            2>&1 | tee contract-test-output.log

      - name: Report coverage (informational, not gated)
        run: |
          grep -oE '[0-9]+% API Coverage reported' contract-test-output.log | head -1 || echo "No coverage line found in output."

      - name: Enforce regression gate
        run: |
          SUMMARY=$(grep -oE 'Tests run: [0-9]+, Successes: [0-9]+, Failures: [0-9]+, WIP: [0-9]+, Errors: [0-9]+' contract-test-output.log | tail -1)
          if [ -z "$SUMMARY" ]; then
            echo "Could not find a test summary line in the output -- failing closed." >&2
            exit 1
          fi
          echo "$SUMMARY"
          SUCCESSES=$(echo "$SUMMARY" | grep -oE 'Successes: [0-9]+' | grep -oE '[0-9]+')
          ERRORS=$(echo "$SUMMARY" | grep -oE 'Errors: [0-9]+' | grep -oE '[0-9]+')
          if [ "$ERRORS" -gt 0 ]; then
            echo "Specmatic reported $ERRORS framework-level error(s) -- treated as a crash, not an expected scenario mismatch." >&2
            exit 1
          fi
          if [ "$SUCCESSES" -eq 0 ]; then
            echo "Zero successful tests -- real auth/fixture generation likely broke, so every test ran against garbage credentials." >&2
            exit 1
          fi

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specmatic-contract-report
          path: specmatic-contract-testing/specmatic/reports/all/

      - name: Tear down
        if: always()
        run: |
          DEPRECATED_COMPOSE_ACK=1 docker compose -f rocketchat-docker/compose.yml -f specmatic/compose.test.yml down -v
